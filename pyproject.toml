[project]
name = "emberline"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pyarrow"]
[project.optional-dependencies]
api = ["fastapi", "uvicorn", "httpx"]
dev = ["pytest"]
[project.scripts]
emberline = "emberline.cli:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["emberline", "emberline.sources"]

[tool.ruff]
line-length = 120
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "NPY"]
ignore = ["E731", "B023", "E501", "B905", "B008"]
[tool.pytest.ini_options]
testpaths = ["tests"]
